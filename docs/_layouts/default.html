<!DOCTYPE html>
<html lang="{{ site.lang | default: "tr" }}">
  <head>
    <meta charset="UTF-8">
    {% seo %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0A0F1E">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      .page-header { background-color: #0A0F1E; background-image: linear-gradient(120deg, #0A0F1E, #155e75); }
      .main-content h1, .main-content h2, .main-content h3 { color: #0e7490; }
      .main-content a { color: #0e7490; }
    </style>
  </head>
  <body>
    <header class="page-header" role="banner">
      <h1 class="project-name">{{ page.title | default: site.title }}</h1>
      <h2 class="project-tagline">{{ site.description }}</h2>
      <a href="{{ '/' | relative_url }}" class="btn">Belgeler</a>
      <a href="https://github.com/alperenyardim30-hash/BobinKumanda/releases/latest" class="btn">İndir</a>
      <a href="https://github.com/alperenyardim30-hash/BobinKumanda/wiki" class="btn">Wiki</a>
      <a href="https://github.com/alperenyardim30-hash/BobinKumanda" class="btn">GitHub</a>
    </header>

    <main id="content" class="main-content" role="main">
      {{ content }}

      <footer class="site-footer">
        <span class="site-footer-owner">Bobin Kumanda · Bahadır Değirmenci ve Alperen Yardım · GPL-3.0</span>
      </footer>
    </main>
  </body>
</html>
