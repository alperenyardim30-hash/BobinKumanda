<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Bobin Kumanda: a contactor coil drawn as its control-circuit symbol (A1 ── ▭ ── A2) on the channel's navy,
       copper wound on a core inside the box, with the channel's bolt striking down into it -->
  <defs>
    <radialGradient id="bk-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1D2D63"/><stop offset=".55" stop-color="#0F1734"/><stop offset="1" stop-color="#0A0F1E"/>
    </radialGradient>
    <linearGradient id="bk-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CF3FF"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#0E9CBF"/>
    </linearGradient>
    <linearGradient id="bk-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".20"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".06"/><stop offset="1" stop-color="#2F6BFF" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="bk-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A8AB0"/><stop offset=".35" stop-color="#4E5D82"/><stop offset="1" stop-color="#2A3552"/>
    </linearGradient>
    <linearGradient id="bk-wire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE66B"/><stop offset=".5" stop-color="#FFC21A"/><stop offset="1" stop-color="#D98A00"/>
    </linearGradient>
    <linearGradient id="bk-bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6B0"/><stop offset=".45" stop-color="#FFD60A"/><stop offset="1" stop-color="#F5A300"/>
    </linearGradient>
    <linearGradient id="bk-lead" gradientUnits="userSpaceOnUse" x1="0" y1="600" x2="0" y2="640">
      <stop offset="0" stop-color="#8CF3FF"/><stop offset="1" stop-color="#0E9CBF"/>
    </linearGradient>
    <filter id="bk-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="bk-glow2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <g class="bk-back">
    <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bk-bg)"/>
    <!-- circuit traces, as in the channel's video backgrounds -->
    <g fill="none" stroke="#22D3EE" stroke-opacity=".16" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 300H214L268 246H360"/><path d="M96 410H170L210 450"/><path d="M928 330H820L770 280V196"/>
      <path d="M928 420H860L820 460"/><path d="M150 930V870L208 812"/><path d="M880 930V870L826 816"/>
    </g>
    <g fill="#22D3EE" fill-opacity=".28">
      <circle cx="360" cy="246" r="15"/><circle cx="210" cy="450" r="13"/><circle cx="770" cy="196" r="15"/>
      <circle cx="820" cy="460" r="13"/><circle cx="208" cy="812" r="13"/><circle cx="826" cy="816" r="13"/>
    </g>
  </g>

  <g class="bk-art" transform="translate(0 56)">
    <!-- the rung: A1 and A2 leads out to their terminals -->
    <g stroke="url(#bk-lead)" stroke-width="26" stroke-linecap="round">
      <path d="M150 620H252"/><path d="M772 620H874"/>
    </g>
    <g fill="#0A0F1E" stroke="url(#bk-rim)" stroke-width="16">
      <circle cx="140" cy="620" r="30"/><circle cx="884" cy="620" r="30"/>
    </g>
    <!-- glow behind the coil box -->
    <rect x="252" y="470" width="520" height="300" rx="44" fill="none" stroke="#22D3EE" stroke-width="44" opacity=".45" filter="url(#bk-glow)"/>
    <rect x="252" y="470" width="520" height="300" rx="44" fill="url(#bk-glass)"/>
    <!-- the coil: copper wire wound across a core, the strands reach past its edges -->
    <rect x="304" y="566" width="416" height="108" rx="26" fill="url(#bk-core)"/>
    <rect x="304" y="574" width="416" height="20" rx="10" fill="#FFFFFF" fill-opacity=".14"/>
    <g stroke-linecap="round">
      <g stroke="#6E4508" stroke-width="22">
        <path d="M342 558L362 686"/><path d="M390 558L410 686"/><path d="M438 558L458 686"/><path d="M486 558L506 686"/>
        <path d="M534 558L554 686"/><path d="M582 558L602 686"/><path d="M630 558L650 686"/>
      </g>
      <g stroke="url(#bk-wire)" stroke-width="18">
        <path d="M340 556L360 684"/><path d="M388 556L408 684"/><path d="M436 556L456 684"/><path d="M484 556L504 684"/>
        <path d="M532 556L552 684"/><path d="M580 556L600 684"/><path d="M628 556L648 684"/>
      </g>
      <g stroke="#FFF7C2" stroke-opacity=".75" stroke-width="5">
        <path d="M339 566L346 612"/><path d="M387 566L394 612"/><path d="M435 566L442 612"/><path d="M483 566L490 612"/>
        <path d="M531 566L538 612"/><path d="M579 566L586 612"/><path d="M627 566L634 612"/>
      </g>
      <!-- the coil's own leads run to the box sides, where A1 and A2 leave it -->
      <path d="M318 620H268" fill="none" stroke="url(#bk-wire)" stroke-width="14"/>
      <path d="M690 620H756" fill="none" stroke="url(#bk-wire)" stroke-width="14"/>
    </g>
    <!-- coil box outline (IEC 60617 coil symbol) -->
    <rect x="252" y="470" width="520" height="300" rx="44" fill="none" stroke="url(#bk-rim)" stroke-width="34"/>
    <path d="M300 500H520" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="12" stroke-linecap="round"/>
    <!-- the channel's bolt striking down into the coil -->
    <g transform="translate(512 318) scale(1.02) translate(-522 -414)">
      <path d="M540 228L466 412H518L484 600L578 446H528L566 228Z" fill="#FFD60A" opacity=".55" filter="url(#bk-glow2)"/>
      <path d="M540 228L466 412H518L484 600L578 446H528L566 228Z" fill="url(#bk-bolt)" stroke="#FFF3A0" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
