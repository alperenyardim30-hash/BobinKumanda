name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Derle
        run: dotnet build BobinKumanda.sln -c Release

      - name: Testler
        run: dotnet test --project tests/BobinKumanda.Core.Tests -c Release --no-build

      - name: Tek dosyalık sürüm
        run: dotnet publish src/BobinKumanda.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist

      - uses: actions/upload-artifact@v7
        with:
          name: BobinKumanda-win-x64
          path: dist/BobinKumanda.exe
          retention-days: 14
